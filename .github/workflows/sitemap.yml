name: Generate Sitemap
on:
  push:
    branches: [ main ] # Change to master if your repository uses it

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # Pinning exact SHA silences the version tag warning

    - name: Generate Sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: "https://gustafson.github.io/My-Scripts" # Replace with your actual username and repo

    - name: Commit and Push Sitemap
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add sitemap.xml
        git commit -m "chore: automatically update sitemap.xml" || exit 0
        git push
