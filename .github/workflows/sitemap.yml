name: Generate Sitemap
on:
  push:
    branches: [ main ] # Change to master if your repo uses it

jobs:
  sitemap:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # Suppresses the Node 20 warning
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: "https://gustafsone.github.io"

    - name: Commit and Push Sitemap
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add sitemap.xml
        git commit -m "chore: automatically update sitemap.xml" || exit 0
        git push
