name: Generate Sitemap
on:
  push:
    branches: [ main ] # Change to master if your repository uses it

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.1.7 # Explicitly pinning a late v4 point release resolves the core tag check

    - name: Generate Sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: "https://gustafsone.github.io/My-Scripts"

    - name: Commit and Push Sitemap
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add sitemap.xml
        git commit -m "chore: automatically update sitemap.xml" || exit 0
        git push
